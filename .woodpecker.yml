when:
  - event: push
  - event: pull_request

steps:
  - name: rust checks
    image: rust:1-bookworm
    environment:
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends libasound2-dev libgl1-mesa-dev libx11-dev libxi-dev pkg-config
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets -- -D warnings
      - cargo test --locked
