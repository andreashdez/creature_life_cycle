when:
  - event: push
  - event: pull_request

steps:
  - name: rust checks
    image: rust:1-bookworm
    environment:
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends libgl1-mesa-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets -- -D warnings
      - cargo test --locked
      # The CLI must keep building without Bevy, so the `gui` feature gate
      # cannot rot unnoticed.
      - cargo check --locked --no-default-features --all-targets
