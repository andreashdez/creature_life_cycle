name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libudev-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # `cargo test` does not run bench targets, so without this a benchmark
      # could compile yet panic. Criterion's test mode runs each benchmark once,
      # untimed, in a few seconds. Timings stay local: shared runners vary too
      # much from run to run for them to mean anything here.
      - name: cargo test benchmarks
        run: cargo test --locked --bench '*'

      # The CLI must keep building without Bevy, so the `gui` feature gate
      # cannot rot unnoticed.
      - name: cargo check without default features
        run: cargo check --locked --no-default-features --all-targets

      # Every item carries a `///` comment, the GUI's private ones included, so
      # the docs are built with private items and broken links fail the run.
      - name: cargo doc
        run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  macos:
    name: macOS build and tests
    # The GUI ships as a macOS app bundle (scripts/package_gui.sh), but the
    # checks above only ever build it on Linux. Bevy's windowing and rendering
    # compile against different platform code on macOS, so building and testing
    # here catches breakage that Linux cannot.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2

      # Builds every target, the GUI binary included, and runs the whole suite.
      # Formatting, lints, and the docs are platform-independent and stay in
      # the Linux job.
      - name: cargo test
        run: cargo test --locked
