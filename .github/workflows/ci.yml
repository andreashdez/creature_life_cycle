name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libudev-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # The CLI must keep building without Bevy, so the `gui` feature gate
      # cannot rot unnoticed.
      - name: cargo check without default features
        run: cargo check --locked --no-default-features --all-targets
