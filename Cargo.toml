[package]
name = "creature_life_cycle"
version = "0.1.0"
edition = "2024"
default-run = "creature_life_cycle"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
macroquad = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "board_refresh"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
